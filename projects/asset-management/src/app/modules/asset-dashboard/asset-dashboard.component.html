<div class="flex flex-col min-h-screen w-full bg-[#F0F2F5] font-inter text-xs">
  <!-- BELOW HEADER: sidebar + content -->
  <div class="flex flex-1">

    <!-- MAIN CONTENT -->
    <div class="flex flex-col flex-1">

      <div class="flex-1 p-4">

        <!-- Page header -->
        <div class="mb-4">
          <div class="flex items-center gap-1.5 text-[10px] text-slate-400 mb-1">
            <span>Apps</span>
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" class="w-2.5 h-2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
            </svg>
            <span class="text-blue-600 font-medium cursor-pointer" (click)="onTabSelect('dashboard')">Asset Management</span>
          </div>
          <h1 class="text-sm font-semibold text-slate-800 mb-3">Asset Management</h1>

          <lib-tabs
            [tabs]="visibleTabs"
            [activeTabId]="activeTabId"
            [autoWidth]="true"
            (tabChange)="onTabSelect($event)">
          </lib-tabs>
        </div>

        <!-- Tab content container -->
        <div class="mt-4">
          <app-asset-dashboard-dashboard *ngIf="activeTabId === 'dashboard'"></app-asset-dashboard-dashboard>
          <app-view-assets *ngIf="activeTabId === 'view-assets'"></app-view-assets>
          <app-create-asset *ngIf="activeTabId === 'create-asset'"></app-create-asset>
          <app-edit-asset *ngIf="activeTabId === 'edit-asset'"></app-edit-asset>
          <app-issue-asset *ngIf="activeTabId === 'issue-asset'"></app-issue-asset>
          <app-return-asset *ngIf="activeTabId === 'return-asset'"></app-return-asset>
          <app-issue-log *ngIf="activeTabId === 'issue-log'"></app-issue-log>
          <app-return-log *ngIf="activeTabId === 'return-log'"></app-return-log>
          <app-create-asset-tag *ngIf="activeTabId === 'create-asset-tag'"></app-create-asset-tag>
          <app-reports *ngIf="activeTabId === 'reports'"></app-reports>
        </div>

      </div>
      <!-- /BODY -->

      <!-- FOOTER -->
      <footer class="h-6 bg-[#434B57] flex items-center justify-center flex-shrink-0">
        <span class="text-[10px] text-white">© Developed by : Software Development Centre, Kristu Jayanti (Deemed to be University), Bangalore</span>
      </footer>

    </div>
    <!-- /MAIN CONTENT -->
  </div>
  <!-- /BELOW HEADER -->
</div>
