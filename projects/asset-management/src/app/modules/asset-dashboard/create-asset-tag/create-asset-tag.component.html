<!-- Form card -->
<div class="bg-white rounded-xl shadow-sm p-5">

  <!-- Card header -->
  <div class="flex items-center gap-2 mb-0.5">
    <div class="w-7 h-7 rounded-lg bg-blue-50 flex items-center justify-center flex-shrink-0">
      <svg fill="none" viewBox="0 0 24 24" stroke="#2B7FFF" stroke-width="1.8" class="w-4 h-4">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M20.25 7.5l-.625 10.632a2.25 2.25 0 0 1-2.247 2.118H6.622a2.25 2.25 0 0 1-2.247-2.118L3.75 7.5M10 11.25h4M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125Z" />
      </svg>
    </div>
    <div>
      <h2 class="text-sm font-semibold text-slate-800 leading-none mb-0.5">Create New Asset Tag</h2>
    </div>
  </div>

  <!-- Divider -->
  <div class="border-t border-slate-100 my-4"></div>

  <div class="flex flex-col gap-4">

    <!-- Category -->
    <div class="flex flex-col gap-1 relative" (click)="$event.stopPropagation()">
      <label class="text-[10px] text-slate-500 font-medium">Category</label>
      <div
        class="h-8 px-3 flex items-center justify-between cursor-pointer bg-white border border-slate-200 rounded-lg hover:border-blue-400 transition-colors"
        (click)="toggleDropdown('cat', $event)">
        <span class="text-xs" [class.text-slate-800]="category" [class.text-slate-400]="!category">
          {{ categoryName || 'Select category' }}
        </span>
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"
          class="w-3 h-3 flex-shrink-0 text-slate-400 transition-transform" [class.rotate-180]="catOpen">
          <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
        </svg>
      </div>
      <div *ngIf="catOpen"
        class="absolute top-full left-0 right-0 mt-1 bg-white border border-slate-200 rounded-lg shadow-lg z-50 overflow-hidden">
        <button *ngFor="let c of categories"
          class="block w-full text-left px-3 py-2 text-xs text-slate-700 hover:bg-blue-50 hover:text-blue-600 transition-colors"
          [class.bg-blue-50]="category === c.id" [class.text-blue-600]="category === c.id"
          (click)="selectOption('category', c, $event)">{{ c.name }}</button>
      </div>
    </div>

    <!-- Asset Tag Name -->
    <div class="flex flex-col gap-1">
      <label class="text-[10px] text-slate-500 font-medium">Asset Tag Name</label>
      <input type="text" [(ngModel)]="assetTagName" placeholder="e.g. KBD-IT-001"
        class="h-8 px-3 border border-slate-200 rounded-lg text-xs text-slate-800 outline-none focus:border-blue-500 transition-colors placeholder:text-slate-400" />
    </div>

    <!-- Display ID -->
    <div class="flex flex-col gap-1 relative" (click)="$event.stopPropagation()">
      <label class="text-[10px] text-slate-500 font-medium">Display ID</label>
      <div
        class="h-8 px-3 flex items-center justify-between cursor-pointer bg-white border border-slate-200 rounded-lg hover:border-blue-400 transition-colors"
        (click)="toggleDropdown('disp', $event)">
        <span class="text-xs" [class.text-slate-800]="displayId" [class.text-slate-400]="!displayId">
          {{ displayId || 'Select display ID' }}
        </span>
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"
          class="w-3 h-3 flex-shrink-0 text-slate-400 transition-transform" [class.rotate-180]="dispOpen">
          <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
        </svg>
      </div>
      <div *ngIf="dispOpen"
        class="absolute top-full left-0 right-0 mt-1 bg-white border border-slate-200 rounded-lg shadow-lg z-50 overflow-hidden">
        <button *ngFor="let d of displayIds"
          class="block w-full text-left px-3 py-2 text-xs text-slate-700 hover:bg-blue-50 hover:text-blue-600 transition-colors"
          [class.bg-blue-50]="displayId === d" [class.text-blue-600]="displayId === d"
          (click)="selectOption('displayId', d, $event)">{{ d }}</button>
      </div>
    </div>

    <!-- Classification -->
    <div class="flex flex-col gap-1 relative" (click)="$event.stopPropagation()">
      <label class="text-[10px] text-slate-500 font-medium">Classification</label>
      <div
        class="h-8 px-3 flex items-center justify-between cursor-pointer bg-white border border-slate-200 rounded-lg hover:border-blue-400 transition-colors"
        (click)="toggleDropdown('class', $event)">
        <span class="text-xs" [class.text-slate-800]="classification" [class.text-slate-400]="!classification">
          {{ classification || 'Select classification' }}
        </span>
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"
          class="w-3 h-3 flex-shrink-0 text-slate-400 transition-transform" [class.rotate-180]="classOpen">
          <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
        </svg>
      </div>
      <div *ngIf="classOpen"
        class="absolute top-full left-0 right-0 mt-1 bg-white border border-slate-200 rounded-lg shadow-lg z-50 overflow-hidden">
        <button *ngFor="let cl of classifications"
          class="block w-full text-left px-3 py-2 text-xs text-slate-700 hover:bg-blue-50 hover:text-blue-600 transition-colors"
          [class.bg-blue-50]="classification === cl" [class.text-blue-600]="classification === cl"
          (click)="selectOption('classification', cl, $event)">{{ cl }}</button>
      </div>
    </div>

  </div>
  <!-- end fields -->

  <!-- Error -->
  <div *ngIf="errorMessage"
    class="mt-4 px-4 py-2.5 rounded-lg bg-red-50 border border-red-200 text-xs text-red-600 flex items-center gap-2">
    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" class="w-4 h-4 flex-shrink-0">
      <path stroke-linecap="round" stroke-linejoin="round"
        d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
    </svg>
    {{ errorMessage }}
  </div>

  <!-- Actions -->
  <div class="flex justify-end gap-3 mt-6 pt-4 border-t border-slate-100">
    <button
      class="h-8 px-5 rounded-lg border border-slate-200 text-xs font-medium text-slate-600 hover:border-slate-400 hover:text-slate-800 transition-all duration-150 active:scale-95"
      [disabled]="isLoading" (click)="goBack()">Cancel</button>
    <button
      class="h-8 px-5 rounded-lg bg-blue-600 text-white text-xs font-semibold hover:bg-blue-700 transition-all duration-150 active:scale-95 disabled:opacity-60 disabled:cursor-not-allowed flex items-center gap-2"
      [disabled]="isLoading" (click)="onSubmit()">
      <svg *ngIf="isLoading" class="animate-spin w-3.5 h-3.5" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
      </svg>
      {{ isLoading ? 'Saving...' : 'Save' }}
    </button>
  </div>

</div>
<!-- end form card -->

<!-- SUCCESS OVERLAY -->
<div *ngIf="showSuccess" class="fixed inset-0 bg-black/30 flex items-center justify-center z-50">
  <div class="bg-white rounded-2xl shadow-2xl p-8 w-80 flex flex-col items-center text-center">
    <div class="w-14 h-14 rounded-full bg-green-500 flex items-center justify-center mb-4 shadow-lg shadow-green-200">
      <svg fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="2.5" class="w-7 h-7">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
      </svg>
    </div>
    <h2 class="text-sm font-bold text-slate-800 mb-1">Asset Tag Created</h2>
    <p class="text-[10px] text-slate-500 mb-5">
      <strong class="text-slate-700">{{ assetTagName }}</strong> tag has been created successfully.
    </p>
    <div class="flex gap-2 w-full">
      <button
        class="flex-1 h-8 rounded-lg border border-slate-200 text-xs font-medium text-slate-600 hover:border-slate-400 hover:text-slate-800 transition-all duration-150 active:scale-95"
        (click)="createAnother()">Create Another</button>
      <button
        class="flex-1 h-8 rounded-lg bg-blue-600 text-white text-xs font-semibold hover:bg-blue-700 transition-all duration-150 active:scale-95"
        (click)="goBack()">Back to Assets</button>
    </div>
  </div>
</div>
