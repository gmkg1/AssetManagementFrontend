<!-- Loading state -->
<div *ngIf="isLoading" class="flex items-center justify-center py-16">
  <div class="w-6 h-6 border-2 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
</div>

<!-- Success toast -->
<div *ngIf="showSuccess"
  class="fixed top-4 right-4 z-50 flex items-center gap-2 bg-green-600 text-white text-xs px-4 py-2.5 rounded-lg shadow-lg">
  <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" class="w-4 h-4">
    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/>
  </svg>
  Saved successfully!
</div>

<ng-container *ngIf="!isLoading">

  <!-- Back button -->
  <button class="flex items-center gap-1.5 text-xs text-slate-500 hover:text-slate-800 transition-colors mb-3 group" (click)="goBack()">
    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" class="w-3.5 h-3.5 transition-transform group-hover:-translate-x-0.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18"/>
    </svg>
    Back to Assets
  </button>

  <!-- Card -->
  <div class="bg-white rounded-lg shadow-sm overflow-hidden" style="border: 1px solid #F0F2F5;">

    <!-- Card header -->
    <div class="flex items-center gap-2 px-5 py-4 border-b border-[#F0F2F5]">
      <div class="w-7 h-7 rounded-lg bg-blue-50 flex items-center justify-center flex-shrink-0">
        <svg fill="none" viewBox="0 0 24 24" stroke="#2B7FFF" stroke-width="1.8" class="w-4 h-4">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z"/>
        </svg>
      </div>
      <div>
        <h2 class="text-sm font-semibold text-[#091E42] leading-none mb-0.5">Edit Licenses and Warranty</h2>
        <p class="text-[10px] text-slate-400 leading-none">I.T / Assets / Edit Licenses and Warranty</p>
      </div>
    </div>

    <!-- Two-column body -->
    <div class="flex min-h-[320px]">

      <!-- LEFT: Edit Licenses -->
      <div class="flex-1 px-6 py-5" style="border-right: 1px solid #F0F2F5;">
        <h3 class="text-xs font-bold text-[#091E42] mb-4">Edit Licenses</h3>

        <div class="flex flex-col gap-3">

          <!-- License Name -->
          <div class="flex flex-col gap-1">
            <label class="text-[10px] font-medium text-slate-500">License Name</label>
            <input
              type="text"
              [(ngModel)]="licenseName"
              placeholder="Enter license name"
              class="h-[34px] w-full rounded-md border border-[#DFE2E6] bg-white px-3 text-xs text-[#243757] placeholder-[#98A1B0] outline-none focus:border-blue-400 focus:ring-1 focus:ring-blue-100 transition-colors"
            />
          </div>

          <!-- License Key -->
          <div class="flex flex-col gap-1">
            <label class="text-[10px] font-medium text-slate-500">License Key</label>
            <input
              type="text"
              [(ngModel)]="licenseKey"
              placeholder="Enter license key"
              class="h-[34px] w-full rounded-md border border-[#DFE2E6] bg-white px-3 text-xs text-[#243757] placeholder-[#98A1B0] font-mono outline-none focus:border-blue-400 focus:ring-1 focus:ring-blue-100 transition-colors"
            />
          </div>

          <!-- Expiry Date -->
          <div class="flex flex-col gap-1">
            <label class="text-[10px] font-medium text-slate-500">Expiry</label>
            <div class="relative">
              <input
                type="date"
                [(ngModel)]="licenseExpiry"
                class="h-[34px] w-full rounded-md border border-[#DFE2E6] bg-white px-3 text-xs text-[#243757] placeholder-[#98A1B0] outline-none focus:border-blue-400 focus:ring-1 focus:ring-blue-100 transition-colors appearance-none pr-8"
              />
              <svg fill="none" viewBox="0 0 24 24" stroke="#7A8699" stroke-width="1.8"
                class="w-4 h-4 absolute right-2.5 top-1/2 -translate-y-1/2 pointer-events-none">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5"/>
              </svg>
            </div>
          </div>

        </div>
      </div>

      <!-- RIGHT: Edit Warranty -->
      <div class="flex-1 px-6 py-5">
        <h3 class="text-xs font-bold text-[#091E42] mb-4">Edit Warranty</h3>

        <div class="flex flex-col gap-3">

          <!-- Name and Provider -->
          <div class="flex flex-col gap-1">
            <label class="text-[10px] font-medium text-slate-500">Name and Provider</label>
            <input
              type="text"
              [(ngModel)]="warrantyName"
              placeholder="Enter provider name"
              class="h-[34px] w-full rounded-md border border-[#DFE2E6] bg-white px-3 text-xs text-[#243757] placeholder-[#98A1B0] outline-none focus:border-blue-400 focus:ring-1 focus:ring-blue-100 transition-colors"
            />
          </div>

          <!-- Reference ID -->
          <div class="flex flex-col gap-1">
            <label class="text-[10px] font-medium text-slate-500">Reference ID</label>
            <input
              type="text"
              [(ngModel)]="warrantyReferenceId"
              placeholder="Enter reference ID"
              class="h-[34px] w-full rounded-md border border-[#DFE2E6] bg-white px-3 text-xs text-[#243757] placeholder-[#98A1B0] font-mono outline-none focus:border-blue-400 focus:ring-1 focus:ring-blue-100 transition-colors"
            />
          </div>

          <!-- Start Date -->
          <div class="flex flex-col gap-1">
            <label class="text-[10px] font-medium text-slate-500">Start Date</label>
            <div class="relative">
              <input
                type="date"
                [(ngModel)]="warrantyStartDate"
                class="h-[34px] w-full rounded-md border border-[#DFE2E6] bg-white px-3 text-xs text-[#243757] placeholder-[#98A1B0] outline-none focus:border-blue-400 focus:ring-1 focus:ring-blue-100 transition-colors appearance-none pr-8"
              />
              <svg fill="none" viewBox="0 0 24 24" stroke="#7A8699" stroke-width="1.8"
                class="w-4 h-4 absolute right-2.5 top-1/2 -translate-y-1/2 pointer-events-none">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5"/>
              </svg>
            </div>
          </div>

          <!-- Expiry Date -->
          <div class="flex flex-col gap-1">
            <label class="text-[10px] font-medium text-slate-500">Expiry Date</label>
            <div class="relative">
              <input
                type="date"
                [(ngModel)]="warrantyExpiryDate"
                class="h-[34px] w-full rounded-md border border-[#DFE2E6] bg-white px-3 text-xs text-[#243757] placeholder-[#98A1B0] outline-none focus:border-blue-400 focus:ring-1 focus:ring-blue-100 transition-colors appearance-none pr-8"
              />
              <svg fill="none" viewBox="0 0 24 24" stroke="#7A8699" stroke-width="1.8"
                class="w-4 h-4 absolute right-2.5 top-1/2 -translate-y-1/2 pointer-events-none">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5"/>
              </svg>
            </div>
          </div>

          <!-- Status -->
          <div class="flex flex-col gap-1">
            <label class="text-[10px] font-medium text-slate-500">Status</label>
            <div class="relative">
              <select
                [(ngModel)]="warrantyStatus"
                class="h-[34px] w-full rounded-md border border-[#DFE2E6] bg-white px-3 text-xs text-[#243757] outline-none focus:border-blue-400 focus:ring-1 focus:ring-blue-100 transition-colors appearance-none pr-8"
                [class.text-[#98A1B0]]="!warrantyStatus"
              >
                <option value="" disabled>Select status</option>
                <option *ngFor="let opt of warrantyStatusOptions" [value]="opt">{{ opt }}</option>
              </select>
              <svg fill="none" viewBox="0 0 24 24" stroke="#7A8699" stroke-width="2"
                class="w-3.5 h-3.5 absolute right-2.5 top-1/2 -translate-y-1/2 pointer-events-none">
                <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5"/>
              </svg>
            </div>
          </div>

        </div>
      </div>

    </div>
    <!-- /Two-column body -->

    <!-- Error message -->
    <div *ngIf="errorMessage" class="mx-5 mb-3 px-3 py-2 bg-red-50 border border-red-200 rounded-md text-xs text-red-600">
      {{ errorMessage }}
    </div>

    <!-- Footer: Cancel + Save -->
    <div class="flex items-center justify-end gap-2 px-5 py-4 border-t border-[#F0F2F5]">
      <button
        type="button"
        (click)="goBack()"
        class="h-8 px-5 rounded-md text-xs font-medium text-[#42526D] transition-colors hover:opacity-80"
        style="background: #EDEDED;">
        Cancel
      </button>
      <button
        type="button"
        (click)="onSave()"
        [disabled]="isSaving"
        class="h-8 px-5 rounded-md text-xs font-medium text-white transition-colors hover:opacity-90 disabled:opacity-60 disabled:cursor-not-allowed flex items-center gap-1.5"
        style="background: #155DFC;">
        <svg *ngIf="isSaving" class="w-3.5 h-3.5 animate-spin" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
        </svg>
        {{ isSaving ? 'Saving...' : 'Save' }}
      </button>
    </div>

  </div>

</ng-container>
