<!-- Form card -->
<div class="bg-white rounded-lg shadow-sm p-3 mb-4">

  <!-- Card header -->
  <div class="flex items-center gap-2 mb-0.5">
    <div class="w-7 h-7 rounded-lg bg-blue-50 flex items-center justify-center flex-shrink-0">
      <svg fill="none" viewBox="0 0 24 24" stroke="#2B7FFF" stroke-width="1.8" class="w-4 h-4">
        <path stroke-linecap="round" stroke-linejoin="round" d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125"/>
      </svg>
    </div>
    <div>
      <h2 class="text-sm font-semibold text-slate-800 leading-none mb-0.5">Edit Asset</h2>
      <p class="text-[10px] text-slate-400 leading-none">Asset ID – {{ assetId }}</p>
    </div>
  </div>

  <!-- Divider -->
  <div class="border-t border-slate-100 my-4"></div>

  <!-- Two-column layout -->
  <div class="flex gap-0">

    <!-- LEFT COLUMN -->
    <div class="flex flex-col gap-3" style="flex: 0 0 clamp(260px, 30%, 360px); padding-right: clamp(12px, 2vw, 28px);">

      <!-- Company -->
      <div class="flex flex-col gap-1">
        <label class="text-[10px] text-slate-500 font-medium">Company</label>
        <div class="relative">
          <select [(ngModel)]="company"
            class="w-full h-8 border border-slate-200 rounded-lg pl-3 pr-8 text-xs text-slate-800 outline-none focus:border-blue-500 appearance-none bg-white cursor-pointer transition-colors">
            <option value="" disabled>Select Company</option>
            <option *ngFor="let c of companies" [value]="c">{{ c }}</option>
          </select>
          <svg class="absolute right-2.5 top-1/2 -translate-y-1/2 w-3 h-3 text-slate-400 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5"/>
          </svg>
        </div>
      </div>

      <!-- Asset Tag / Model (Searchable Dropdown) -->
      <div class="flex flex-col gap-1 relative" (click)="$event.stopPropagation()">
        <label class="text-[10px] text-slate-500 font-medium">Asset Tag (Model) <span class="text-red-400">*</span></label>
        <div class="flex items-center gap-2">
          <div class="relative flex-1">
            <input type="text"
                   placeholder="Search & Select Tag..."
                   [(ngModel)]="assetTagSearch"
                   (focus)="showTagDropdown = true"
                   (input)="filterAssetTags()"
                   class="w-full h-8 border border-slate-200 rounded-lg pl-3 pr-8 text-xs text-slate-800 outline-none focus:border-blue-500 transition-colors placeholder:text-slate-400 bg-white"/>
            <button type="button"
                    class="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 focus:outline-none"
                    (click)="showTagDropdown = !showTagDropdown; $event.stopPropagation()">
              <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" class="w-3 h-3"><path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5"/></svg>
            </button>
            <!-- Dropdown List -->
            <div *ngIf="showTagDropdown"
                 class="absolute top-full left-0 right-0 mt-1 bg-white border border-slate-200 rounded-lg shadow-lg z-50 max-h-40 overflow-y-auto">
              <div *ngFor="let t of filteredModels"
                   (click)="selectAssetTag(t)"
                   class="px-3 py-2 hover:bg-blue-50 hover:text-blue-600 cursor-pointer transition-colors text-xs text-slate-700">
                {{ t.name }}
              </div>
              <div *ngIf="filteredModels.length === 0" class="px-3 py-2 text-xs text-slate-400">
                No tags found.
              </div>
            </div>
          </div>
          <button type="button" class="w-8 h-8 border border-slate-200 rounded-lg flex items-center justify-center text-slate-500 hover:border-blue-400 hover:text-blue-600 transition-colors flex-shrink-0"
            title="Add new tag" (click)="goToCreateTag()">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" class="w-3.5 h-3.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Serial -->
      <div class="flex flex-col gap-1">
        <label class="text-[10px] text-slate-500 font-medium">Serial <span class="text-red-400">*</span></label>
        <input type="text" [(ngModel)]="serial" placeholder="Enter Serial Number"
          class="h-8 border border-slate-200 rounded-lg px-3 text-xs text-slate-800 outline-none focus:border-blue-500 transition-colors placeholder:text-slate-400"/>
      </div>

      <!-- Status -->
      <div class="flex flex-col gap-1">
        <label class="text-[10px] text-slate-500 font-medium">Status <span class="text-red-400">*</span></label>
        <div class="relative">
          <select [(ngModel)]="status"
            class="w-full h-8 border border-slate-200 rounded-lg pl-3 pr-8 text-xs text-slate-800 outline-none focus:border-blue-500 appearance-none bg-white cursor-pointer transition-colors">
            <option value="" disabled>Select a Status</option>
            <option *ngFor="let s of statuses" [value]="s.id">{{ s.name }}</option>
          </select>
          <svg class="absolute right-2.5 top-1/2 -translate-y-1/2 w-3 h-3 text-slate-400 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5"/>
          </svg>
        </div>
      </div>

      <!-- Default Location -->
      <div class="flex flex-col gap-1">
        <label class="text-[10px] text-slate-500 font-medium">Default Location</label>
        <div class="relative">
          <select [(ngModel)]="defaultLocation"
            class="w-full h-8 border border-slate-200 rounded-lg pl-3 pr-8 text-xs text-slate-800 outline-none focus:border-blue-500 appearance-none bg-white cursor-pointer transition-colors">
            <option value="" disabled>Select a Location</option>
            <option *ngFor="let l of locations" [value]="l.id">{{ l.name }}</option>
          </select>
          <svg class="absolute right-2.5 top-1/2 -translate-y-1/2 w-3 h-3 text-slate-400 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5"/>
          </svg>
        </div>
      </div>

    </div>
    <!-- END LEFT COLUMN -->

    <!-- Vertical divider -->
    <div class="border-l border-slate-100 self-stretch" style="margin-left: clamp(12px, 1.5vw, 24px); margin-right: clamp(12px, 1.5vw, 24px);"></div>

    <!-- RIGHT COLUMN -->
    <div class="flex flex-col gap-3 flex-1 min-w-0">

      <!-- Section title -->
      <p class="text-xs font-semibold text-slate-700 mb-1">Optional Information</p>

      <!-- Asset Name -->
      <div class="flex flex-col gap-1">
        <label class="text-[10px] text-slate-500 font-medium">Asset Name</label>
        <input type="text" [(ngModel)]="assetName" placeholder="e.g. MacBook Pro"
          class="h-8 border border-slate-200 rounded-lg px-3 text-xs text-slate-800 outline-none focus:border-blue-500 transition-colors placeholder:text-slate-400"/>
      </div>

      <!-- Order Number -->
      <div class="flex flex-col gap-1">
        <label class="text-[10px] text-slate-500 font-medium">Order Number</label>
        <input type="text" [(ngModel)]="orderNumber" placeholder=""
          class="h-8 border border-slate-200 rounded-lg px-3 text-xs text-slate-800 outline-none focus:border-blue-500 transition-colors placeholder:text-slate-400"/>
      </div>

      <!-- Purchase Date / EOL Date -->
      <div class="grid grid-cols-2 gap-3">
        <div class="flex flex-col gap-1">
          <label class="text-[10px] text-slate-500 font-medium">Purchase Date</label>
          <input type="date" [(ngModel)]="purchaseDate"
            class="h-8 border border-slate-200 rounded-lg px-3 text-xs text-slate-800 outline-none focus:border-blue-500 transition-colors"/>
        </div>
        <div class="flex flex-col gap-1">
          <label class="text-[10px] text-slate-500 font-medium">EOL Date</label>
          <input type="date" [(ngModel)]="eolDate"
            class="h-8 border border-slate-200 rounded-lg px-3 text-xs text-slate-800 outline-none focus:border-blue-500 transition-colors"/>
        </div>
      </div>

      <!-- Quantity & Unit of Measure -->
      <div class="grid grid-cols-2 gap-3">
        <div class="flex flex-col gap-1">
          <label class="text-[10px] text-slate-500 font-medium">Quantity</label>
          <input type="text" inputmode="numeric" [(ngModel)]="quantity" (keydown)="blockNonIntegers($event)"
            placeholder="e.g. 1" pattern="[0-9]*"
            class="h-8 border border-slate-200 rounded-lg px-3 text-xs text-slate-800 outline-none focus:border-blue-500 transition-colors placeholder:text-slate-400"/>
        </div>
        <div class="flex flex-col gap-1">
          <label class="text-[10px] text-slate-500 font-medium">Unit of Measure</label>
          <div class="relative">
            <select [(ngModel)]="unitOfMeasure"
              class="w-full h-8 border border-slate-200 rounded-lg pl-3 pr-8 text-xs text-slate-800 outline-none focus:border-blue-500 appearance-none bg-white cursor-pointer transition-colors">
              <option value="" disabled>Select Unit</option>
              <option *ngFor="let u of unitsOfMeasure" [value]="u.id">{{ u.name }}</option>

            </select>
            <svg class="absolute right-2.5 top-1/2 -translate-y-1/2 w-3 h-3 text-slate-400 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5"/>
            </svg>
          </div>
        </div>
      </div>

      <!-- Purchase Cost / Returnable -->
      <div class="grid grid-cols-2 gap-3 items-end">

        <!-- Purchase Cost -->
        <div class="flex flex-col gap-1">
          <label class="text-[10px] text-slate-500 font-medium">Purchase Cost</label>
          <div class="flex items-center h-8 border border-slate-200 rounded-lg overflow-hidden focus-within:border-blue-500 transition-colors">
            <span class="px-2 text-[10px] text-slate-400 border-r border-slate-200 h-full flex items-center bg-slate-50 flex-shrink-0">INR</span>
            <input type="number" [(ngModel)]="purchaseCost" (keydown)="blockNonNumbers($event)" min="0" step="1" placeholder="0"
              class="flex-1 px-2 text-xs text-slate-800 outline-none bg-transparent placeholder:text-slate-400 [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none"/>
          </div>
        </div>

        <!-- Returnable Asset -->
        <div class="flex flex-col gap-1">
          <label class="text-[10px] text-slate-500 font-medium">Item Category</label>
          <div class="flex items-center gap-2 h-8">
            <input type="checkbox" id="returnableAsset" [(ngModel)]="isReturnable"
              class="w-3.5 h-3.5 rounded accent-blue-600 cursor-pointer flex-shrink-0" />
            <label for="returnableAsset" class="text-xs text-slate-600 cursor-pointer">Returnable Asset</label>
          </div>
        </div>

      </div>


    </div>
    <!-- END RIGHT COLUMN -->

  </div>
  <!-- END TWO-COLUMN -->

  <!-- Error -->
  <div *ngIf="errorMessage" class="mt-4 px-4 py-2.5 rounded-lg bg-red-50 border border-red-200 text-xs text-red-600 flex items-center gap-2">
    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" class="w-4 h-4 flex-shrink-0">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z"/>
    </svg>
    {{ errorMessage }}
  </div>

  <!-- Actions -->
  <div class="flex justify-end gap-3 mt-5 pt-1 border-t border-slate-100">
    <button class="h-8 px-5 rounded-lg border border-slate-200 text-xs font-medium text-slate-600 hover:border-slate-400 hover:text-slate-800 transition-all duration-150 active:scale-95"
      [disabled]="isLoading" (click)="goBack()">Cancel</button>
    <button class="h-8 px-5 rounded-lg bg-blue-600 text-white text-xs font-semibold hover:bg-blue-700 transition-all duration-150 active:scale-95 disabled:opacity-60 disabled:cursor-not-allowed flex items-center gap-2"
      [disabled]="isLoading" (click)="onSubmit()">
      <svg *ngIf="isLoading" class="animate-spin w-3.5 h-3.5" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
      </svg>
      {{ isLoading ? 'Save' : 'Save' }}
    </button>
  </div>

</div>
<!-- END FORM CARD -->

<!-- SUCCESS OVERLAY -->
<div *ngIf="showSuccess" class="fixed inset-0 bg-black/30 flex items-center justify-center z-50">
  <div class="bg-white rounded-2xl shadow-2xl p-8 w-80 flex flex-col items-center text-center">
    <div class="w-14 h-14 rounded-full bg-green-500 flex items-center justify-center mb-4 shadow-lg shadow-green-200">
      <svg fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="2.5" class="w-7 h-7">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/>
      </svg>
    </div>
    <h2 class="text-sm font-bold text-slate-800 mb-1">Asset Updated</h2>
    <p class="text-[10px] text-slate-500 mb-5">
      <strong class="text-slate-700">{{ assetName || assetTag }}</strong> has been updated successfully.
    </p>
    <div class="flex gap-2 w-full">
      <button class="flex-1 h-8 rounded-lg border border-slate-200 text-xs font-medium text-slate-600 hover:border-slate-400 transition-all active:scale-95"
        (click)="showSuccess = false">Continue Editing</button>
      <button class="flex-1 h-8 rounded-lg bg-blue-600 text-white text-xs font-semibold hover:bg-blue-700 transition-all active:scale-95"
        (click)="goBack()">Back to Assets</button>
    </div>
  </div>
</div>
