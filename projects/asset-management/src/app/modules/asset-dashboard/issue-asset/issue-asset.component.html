<!-- Form card -->
<div class="bg-white rounded-xl shadow-sm p-5 mb-6">
  <h1 class="text-sm font-semibold text-slate-800 mb-0.5">Issue Asset</h1>
  <p class="text-[10px] text-slate-400 mb-5">Asset Tag – {{ assetTag }}</p>

  <div class="grid grid-cols-2 gap-x-8 gap-y-4">

    <!-- LEFT -->
    <div class="flex flex-col gap-4">
      <!-- Asset -->
      <div class="flex flex-col gap-1 relative">
        <label class="text-[10px] text-slate-500 font-medium">Asset</label>
        <div class="flex items-center h-8 border border-slate-200 rounded-lg px-3 hover:border-blue-400 transition-colors">
          <input type="text" [(ngModel)]="assetSearch"
            (focus)="assetDropdownOpen = true"
            (input)="onAssetSearchInput(assetSearch)"
            placeholder="Search asset name"
            class="flex-1 bg-transparent text-xs text-slate-800 border-0 outline-none ring-0 focus:outline-none focus:ring-0 focus:border-0 placeholder:text-slate-400"/>
        </div>
        <div *ngIf="assetDropdownOpen" class="absolute top-full left-0 right-0 mt-1 bg-white border border-slate-200 rounded-lg shadow-lg z-50 overflow-hidden max-h-56 overflow-y-auto">
          <div *ngIf="assetOptionsLoading" class="px-3 py-2 text-xs text-slate-400">Loading options...</div>
          <button *ngFor="let asset of assetsList"
            class="block w-full text-left px-3 py-2 text-xs text-slate-700 hover:bg-blue-50 hover:text-blue-600 transition-colors"
            [class.bg-blue-50]="assetSearch === asset.displayLabel"
            [class.text-blue-600]="assetSearch === asset.displayLabel"
            (click)="selectAssetOption(asset); $event.stopPropagation()">
            {{ asset.displayLabel }}
          </button>
          <div *ngIf="!assetOptionsLoading && assetsList.length === 0" class="px-3 py-2 text-xs text-slate-400">No assets found.</div>
        </div>
      </div>
      <!-- Issue To -->
      <div class="flex flex-col gap-1">
        <label class="text-[10px] text-slate-500 font-medium">Issue To</label>
        <div class="flex gap-2">
          <button *ngFor="let opt of ['User','Asset','Location']"
            class="flex items-center gap-1.5 px-3 h-8 rounded-lg border text-xs font-medium transition-all duration-150"
            [class.bg-blue-600]="issueTo === opt" [class.border-blue-600]="issueTo === opt" [class.text-white]="issueTo === opt"
            [class.border-slate-200]="issueTo !== opt" [class.text-slate-600]="issueTo !== opt" [class.hover:border-slate-400]="issueTo !== opt"
            (click)="onIssueToChange(opt)">{{ opt }}</button>
        </div>
      </div>
      <!-- Receiver -->
      <div class="flex flex-col gap-1 relative">
        <label class="text-[10px] text-slate-500 font-medium">{{ issueTo }}</label>
        <div class="flex items-center h-8 border border-slate-200 rounded-lg px-3 hover:border-blue-400 transition-colors">
          <input type="text" [(ngModel)]="receiverSearch"
            (focus)="receiverDropdownOpen = true"
            (input)="receiverDropdownOpen = true"
            [placeholder]="'Search ' + issueTo.toLowerCase()"
            class="flex-1 bg-transparent text-xs text-slate-800 border-0 outline-none ring-0 focus:outline-none focus:ring-0 focus:border-0 placeholder:text-slate-400"/>
        </div>
        <div *ngIf="receiverDropdownOpen" class="absolute top-full left-0 right-0 mt-1 bg-white border border-slate-200 rounded-lg shadow-lg z-50 overflow-hidden max-h-56 overflow-y-auto">
          <div *ngIf="receiverOptionsLoading" class="px-3 py-2 text-xs text-slate-400">Loading options...</div>
          <button *ngFor="let item of filteredReceiverOptions"
            class="block w-full text-left px-3 py-2 text-xs text-slate-700 hover:bg-blue-50 hover:text-blue-600 transition-colors"
            [class.bg-blue-50]="selectedReceiverId === item._id"
            [class.text-blue-600]="selectedReceiverId === item._id"
            (click)="selectReceiverOption(item); $event.stopPropagation()">
            {{ item.label }}
          </button>
          <div *ngIf="!receiverOptionsLoading && filteredReceiverOptions.length === 0" class="px-3 py-2 text-xs text-slate-400">No {{ issueTo.toLowerCase() }}s found.</div>
        </div>
      </div>
    </div>

    <!-- RIGHT -->
    <div class="flex flex-col gap-4">
      <!-- Issue Date -->
      <div class="flex flex-col gap-1">
        <label class="text-[10px] text-slate-500 font-medium">Issue Date</label>
        <input type="date" [(ngModel)]="issueDate"
          class="h-8 border border-slate-200 rounded-lg px-3 text-xs text-slate-800 outline-none focus:border-blue-500 transition-colors"/>
      </div>
      <!-- Return Date + Time -->
      <div class="grid grid-cols-2 gap-3">
        <div class="flex flex-col gap-1">
          <label class="text-[10px] text-slate-500 font-medium">Expected Return Date</label>
          <input type="date" [(ngModel)]="expectedReturn" [min]="issueDate"
            class="h-8 border border-slate-200 rounded-lg px-3 text-xs text-slate-800 outline-none focus:border-blue-500 transition-colors"/>
        </div>
        <div class="flex flex-col gap-1">
          <label class="text-[10px] text-slate-500 font-medium">Expected Return Time</label>
          <input type="time" [(ngModel)]="expectedReturnTime"
            class="h-8 border border-slate-200 rounded-lg px-3 text-xs text-slate-800 outline-none focus:border-blue-500 transition-colors"/>
        </div>
      </div>
      <!-- Notes -->
      <div class="flex flex-col gap-1">
        <label class="text-[10px] text-slate-500 font-medium">Notes</label>
        <textarea [(ngModel)]="notes" rows="5"
          class="border border-slate-200 rounded-lg px-3 py-2 text-xs text-slate-800 outline-none focus:border-blue-500 transition-colors resize-none placeholder:text-slate-400"></textarea>
      </div>
    </div>

  </div>

  <!-- Actions -->
  <div *ngIf="submitError" class="mt-4 text-xs text-red-600 bg-red-50 border border-red-100 rounded-lg px-3 py-2">
    {{ submitError }}
  </div>
  <div class="flex justify-end gap-3 mt-5 pt-4 border-t border-slate-100">
    <button class="h-8 px-5 rounded-lg border border-slate-200 text-xs font-medium text-slate-600 hover:border-slate-400 hover:text-slate-800 transition-all duration-150 active:scale-95"
      (click)="goBack()">Cancel</button>
    <button class="h-8 px-5 rounded-lg bg-blue-600 text-white text-xs font-semibold hover:bg-blue-700 transition-all duration-150 active:scale-95 disabled:opacity-60"
      [disabled]="isSubmitting"
      (click)="onSubmit()">Issue Asset</button>
  </div>
</div>


<div *ngIf="showSuccess" class="fixed inset-0 bg-black/30 flex items-center justify-center z-50">
  <div class="bg-white rounded-2xl shadow-2xl p-8 w-80 flex flex-col items-center text-center">
    <div class="w-14 h-14 rounded-full bg-green-500 flex items-center justify-center mb-4 shadow-lg shadow-green-200">
      <svg fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="2.5" class="w-7 h-7">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/>
      </svg>
    </div>
    <h2 class="text-sm font-bold text-slate-800 mb-1">Asset Issued Successfully</h2>
    <p class="text-[10px] text-slate-500 mb-5"><strong class="text-slate-700">{{ assetName }}</strong> has been issued successfully.</p>
    <div class="flex gap-2 w-full">
      <button class="flex-1 h-8 rounded-lg border border-slate-200 text-xs font-medium text-slate-600 hover:border-slate-400 transition-all active:scale-95" (click)="issueAnother()">Issue Another</button>
      <button class="flex-1 h-8 rounded-lg bg-blue-600 text-white text-xs font-semibold hover:bg-blue-700 transition-all active:scale-95" (click)="goBack()">Back to Assets</button>
    </div>
  </div>
</div>
